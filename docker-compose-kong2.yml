services:
  postgres-kong2:
    image: postgres:17
    container_name: rbac-postgres-kong2
    environment:
      POSTGRES_DB: kong2
      POSTGRES_USER: kong2
      POSTGRES_PASSWORD: kong2
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_kong2_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kong2"]
      interval: 10s
      timeout: 5s
      retries: 5

  kong2-migrations:
    image: kong:3.6
    container_name: rbac-kong2-migrations
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong2
      KONG_PG_USER: kong2
      KONG_PG_PASSWORD: kong2
      KONG_PG_DATABASE: kong2
    command: kong migrations bootstrap
    depends_on:
      postgres-kong2:
        condition: service_healthy

  kong2:
    image: kong:3.6
    container_name: rbac-kong2
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: postgres-kong2
      KONG_PG_USER: kong2
      KONG_PG_PASSWORD: kong2
      KONG_PG_DATABASE: kong2
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001, 0.0.0.0:8444 ssl
      KONG_ADMIN_GUI_URL: http://localhost:10002
      KONG_ADMIN_GUI_API_URL: http://localhost:10001
    ports:
      - "10000:8000"
      - "10443:8443"
      - "10001:8001"
      - "10444:8444"
      - "10002:8002"
    depends_on:
      kong2-migrations:
        condition: service_completed_successfully

volumes:
  postgres_kong2_data:
