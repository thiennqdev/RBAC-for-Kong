# ===============================
# Production Environment Cache Configuration
# ===============================

# Longer TTLs for production stability
app.cache.project.project-ttl=2h
app.cache.project.list-ttl=30m
app.cache.project.exists-ttl=1h

# Larger connection pool for production load
app.cache.connection-pool.max-active=50
app.cache.connection-pool.max-idle=20
app.cache.connection-pool.min-idle=5
app.cache.connection-pool.max-wait=10s

# Production logging levels
logging.level.com.vcc.template.common.config=INFO
logging.level.org.springframework.cache=WARN
logging.level.org.springframework.data.redis=WARN