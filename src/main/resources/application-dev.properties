# ===============================
# Development Environment
# ===============================

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/rbac_management
spring.datasource.username=postgres
spring.datasource.password=postgres

# ===============================
# Keycloak Configuration
# ===============================
keycloak.server-url=http://localhost:8180
keycloak.auth.realm=rbac-management
keycloak.admin.username=admin
keycloak.admin.password=admin

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=redis123

# ===============================
# S3 Configuration (disabled for now)
# ===============================
s3.endpoint=http://localhost:9000
s3.access-key=minioadmin
s3.secret-key=minioadmin

# ===============================
# Storage Provisioning (Project MinIO)
# ===============================
app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=minioadmin
app.storage.minio.secret-key=minioadmin
app.storage.minio.region=us-east-1

# Shorter TTLs for faster development testing
app.cache.project.project-ttl=5m
app.cache.project.list-ttl=2m
app.cache.project.exists-ttl=3m

# Smaller connection pool for development
app.cache.connection-pool.max-active=5
app.cache.connection-pool.max-idle=3
app.cache.connection-pool.min-idle=1
app.cache.connection-pool.max-wait=3s

# Enable detailed logging for development
# logging.level.com.vcc.template.common.cache.config=DEBUG
# logging.level.org.springframework.cache=DEBUG
# logging.level.org.springframework.data.redis=DEBUG
# logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ===============================
# Prometheus Configuration
# ===============================
prometheus.url=http://localhost:9090

# ===============================
# Google SMTP Configuration
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@example.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:your-email@example.com}