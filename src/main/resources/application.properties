# ===============================
# Server Configuration
# ===============================
spring.threads.virtual.enabled=false
spring.application.name=rbac-service
spring.profiles.active=dev

# ===============================
# API Versioning Configuration
# ===============================
spring.mvc.apiversion.default=1.0
spring.mvc.apiversion.use.header=x-api-version
spring.mvc.apiversion.supported=1.0,2.0


# ===============================
# Database Configuration
# ===============================
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=
spring.datasource.username=
spring.datasource.password= 

# ===============================
# MongoDB Configuration
# ===============================
spring.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/rbac_kong_logs}}
spring.mongodb.database=rbac_kong_logs
spring.data.mongodb.uri=${SPRING_MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/rbac_kong_logs}}
spring.data.mongodb.database=rbac_kong_logs
# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.open-in-view=false

# ===============================
# Connection Pool Configuration
# ===============================
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.max-lifetime=180000
spring.datasource.hikari.pool-name=PostgresqlConnectionPool
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.leak-detection-threshold=15000

# ===============================
# Redis Configuration
# ===============================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=1
spring.data.redis.password=${REDIS_PASSWORD:redis123}
spring.data.redis.timeout=2000ms

spring.data.redis.lettuce.pool.max-active=${app.cache.connection-pool.max-active}
spring.data.redis.lettuce.pool.max-idle=${app.cache.connection-pool.max-idle}
spring.data.redis.lettuce.pool.min-idle=${app.cache.connection-pool.min-idle}
spring.data.redis.lettuce.pool.max-wait=${app.cache.connection-pool.max-wait}

# ===============================
# Cache Configuration
# ===============================
app.cache.enabled=true
app.cache.default-ttl=1h

# Project Cache Settings
app.cache.project.project-ttl=1h
app.cache.project.list-ttl=15m
app.cache.project.exists-ttl=30m

# ===============================
# Liquibase Configuration
# ===============================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-global.yaml
spring.liquibase.default-schema=public

# ===============================
# Log Configuration
# ===============================
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%-5level) %clr([%15.15thread]){magenta} %cyan(%logger{40}): %msg%n

# ===============================
# Security Configuration
# ===============================
keycloak.server-url=
keycloak.auth.realm=
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url}/realms/${keycloak.auth.realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.principal-claim-name=preferred_username
security.jwt.tenant-claim-name=tenant_id
security.encryption.master-key=${MASTER_KEY:my-secure-master-key-32-bytes-ok}

security.url.allow.unauthenticated=/actuator/health/**,/swagger-ui/**,/swagger-ui.html,/swagger, /v3/api-docs/**,/ws/logs/**,/api/internal/**
cors.allowed-origins=http://localhost:4200,http://localhost:5173

# ===============================
# Keycloak Admin Configuration
# ===============================
keycloak.admin.username=
keycloak.admin.password=

# ===============================
# Bootstrap Configuration
# ===============================
app.bootstrap.sync-admin-users=true

# ===============================
# HealthCheck Configuration
# ===============================
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# ===============================
# API Document Configuration
# ===============================
springdoc.swagger-ui.path=/swagger
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.try-it-out-enabled=true
springdoc.api-docs.title=RBAC Service API

# ===============================
# S3 Configuration (MinIO/AWS S3)
# ===============================
s3.endpoint=http://localhost:9000
s3.access-key=minioadmin
s3.secret-key=minioadmin
s3.region=us-east-1
s3.bucket=devops-platform
s3.force-path-style=true

# ===============================
# Storage Provisioning (Project MinIO)
# ===============================
app.storage.minio.endpoint=http://localhost:9000
app.storage.minio.access-key=minioadmin
app.storage.minio.secret-key=minioadmin
app.storage.minio.region=us-east-1

# ===============================
# Kafka Configuration (Live Logs)
# ===============================
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=rbac-log-consumer
spring.kafka.consumer.auto-offset-reset=latest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
app.kafka.topic.kong-logs=kong-log

# ===============================
# Kong http-log Plugin Callback
# ===============================
# Kong OSS does not have kafka-log plugin. We use http-log instead:
# Kong -> HTTP POST to this URL -> Backend produces to Kafka -> Consumer -> WebSocket
kong.http-log.callback-url=http://host.docker.internal:8080/api/internal/kong-logs

