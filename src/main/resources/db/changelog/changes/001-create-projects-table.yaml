databaseChangeLog:
  - changeSet:
      id: 001-create-projects-table
      author: system
      comment: Create projects table in public schema with audit fields
      changes:
        - createTable:
            tableName: projects
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_code
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: project_name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: icon_path
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: projects
            columnNames: project_code
            constraintName: uk_project_code
      rollback:
        - dropTable:
            tableName: projects

  - changeSet:
      id: 002-add-projects-indexes
      author: system
      comment: Add indexes for project_code
      changes:
        - createIndex:
            indexName: idx_projects_code
            tableName: projects
            columns:
              - column:
                  name: project_code
      rollback:
        - dropIndex:
            indexName: idx_projects_code
            tableName: projects
