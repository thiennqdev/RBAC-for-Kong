databaseChangeLog:
  - changeSet:
      id: 015-create-kong-tables
      author: system
      comment: Create Kong management tables for tracking resources across tenants
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: kong_services
      changes:
        - createTable:
            tableName: kong_services
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: kong_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_svc_project
                    references: projects(id)
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(200)
              - column:
                  name: host
                  type: VARCHAR(500)
              - column:
                  name: port
                  type: INT
              - column:
                  name: protocol
                  type: VARCHAR(10)
              - column:
                  name: path
                  type: VARCHAR(500)
              - column:
                  name: enabled
                  type: BOOLEAN
              - column:
                  name: sync_status
                  type: VARCHAR(20)
              - column:
                  name: tags
                  type: TEXT
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(50)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(50)

        - createTable:
            tableName: kong_routes
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: kong_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: kong_service_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_route_service
                    references: kong_services(id)
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_route_project
                    references: projects(id)
              - column:
                  name: name
                  type: VARCHAR(200)
              - column:
                  name: display_name
                  type: VARCHAR(200)
              - column:
                  name: paths
                  type: TEXT
              - column:
                  name: methods
                  type: TEXT
              - column:
                  name: protocols
                  type: TEXT
              - column:
                  name: strip_path
                  type: BOOLEAN
              - column:
                  name: preserve_host
                  type: BOOLEAN
              - column:
                  name: sync_status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(50)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(50)

        - createTable:
            tableName: kong_upstreams
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: kong_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_upstr_project
                    references: projects(id)
              - column:
                  name: name
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: display_name
                  type: VARCHAR(200)
              - column:
                  name: algorithm
                  type: VARCHAR(50)
              - column:
                  name: slots
                  type: INT
              - column:
                  name: sync_status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(50)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(50)

        - createTable:
            tableName: kong_plugins
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: kong_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_plugin_project
                    references: projects(id)
              - column:
                  name: plugin_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: scope
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: scope_entity_id
                  type: BIGINT
              - column:
                  name: config
                  type: TEXT
              - column:
                  name: enabled
                  type: BOOLEAN
              - column:
                  name: sync_status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(50)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(50)
