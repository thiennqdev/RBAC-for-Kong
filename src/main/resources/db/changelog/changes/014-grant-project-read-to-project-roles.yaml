databaseChangeLog:
  - changeSet:
      id: 021-grant-project-read-to-project-roles
      author: system
      comment: Grant PROJECT_READ to PROJECT_ADMIN, DEVELOPER, and VIEWER roles, and PROJECT_WRITE to PROJECT_ADMIN.
      changes:
        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.role_name IN ('PROJECT_ADMIN', 'DEVELOPER', 'VIEWER') 
              AND p.permission_name = 'PROJECT_READ'
              AND NOT EXISTS (SELECT 1 FROM role_permissions rp WHERE rp.role_id = r.id AND rp.permission_id = p.id);

        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.role_name = 'PROJECT_ADMIN' 
              AND p.permission_name = 'PROJECT_WRITE'
              AND NOT EXISTS (SELECT 1 FROM role_permissions rp WHERE rp.role_id = r.id AND rp.permission_id = p.id);
