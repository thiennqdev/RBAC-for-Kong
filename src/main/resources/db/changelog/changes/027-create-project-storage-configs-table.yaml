databaseChangeLog:
  - changeSet:
      id: 027-create-project-storage-configs-table
      author: antigravity
      changes:
        - createTable:
            tableName: project_storage_configs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: bucket_name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: access_key
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: secret_key
                  type: VARCHAR(200)
                  constraints:
                    nullable: false
              - column:
                  name: quota_in_bytes
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: is_public
                  type: BOOLEAN
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  defaultValue: 'ACTIVE'
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
              - column:
                  name: updated_at
                  type: TIMESTAMP
        - addForeignKeyConstraint:
            baseTableName: project_storage_configs
            baseColumnNames: project_id
            constraintName: fk_storage_configs_project
            referencedTableName: projects
            referencedColumnNames: id
            onDelete: CASCADE
