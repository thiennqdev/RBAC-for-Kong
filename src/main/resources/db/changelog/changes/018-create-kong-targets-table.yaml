databaseChangeLog:
  - changeSet:
      id: 018-create-kong-targets-table
      author: system
      comment: Create Kong targets table for tracking upstream targets across tenants
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: kong_targets
      changes:
        - createTable:
            tableName: kong_targets
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: kong_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: kong_upstream_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_target_upstream
                    references: kong_upstreams(id)
              - column:
                  name: project_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_kong_target_project
                    references: projects(id)
              - column:
                  name: target
                  type: VARCHAR(500)
                  constraints:
                    nullable: false
              - column:
                  name: weight
                  type: INT
                  defaultValueNumeric: 100
              - column:
                  name: sync_status
                  type: VARCHAR(20)
              - column:
                  name: created_at
                  type: TIMESTAMP
              - column:
                  name: created_by
                  type: VARCHAR(50)
              - column:
                  name: updated_at
                  type: TIMESTAMP
              - column:
                  name: updated_by
                  type: VARCHAR(50)
