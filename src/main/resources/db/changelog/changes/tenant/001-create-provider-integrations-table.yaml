databaseChangeLog:
  - changeSet:
      id: 001-create-provider-integrations-table
      author: system
      comment: Create provider_integrations table for tenant
      changes:
        - createTable:
            tableName: provider_integrations
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: identifier
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: channel_type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: provider_id
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: credentials
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: is_primary
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_by
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: provider_integrations
            columnNames: identifier
            constraintName: uk_provider_integrations_identifier
      rollback:
        - dropTable:
            tableName: provider_integrations
