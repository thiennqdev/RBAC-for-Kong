databaseChangeLog:
  - changeSet:
      id: 007-create-gateway-logs-table
      author: system
      changes:
        - createTable:
            tableName: gateway_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: method
                  type: VARCHAR(10)
              - column:
                  name: uri
                  type: TEXT
              - column:
                  name: status_code
                  type: INT
              - column:
                  name: client_ip
                  type: VARCHAR(45)
              - column:
                  name: latency
                  type: BIGINT
              - column:
                  name: kong_latency
                  type: BIGINT
              - column:
                  name: upstream_latency
                  type: BIGINT
              - column:
                  name: service_name
                  type: VARCHAR(255)
              - column:
                  name: upstream_uri
                  type: TEXT
              - column:
                  name: timestamp
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
        - createIndex:
            tableName: gateway_logs
            indexName: idx_gateway_logs_timestamp
            columns:
              - column:
                  name: timestamp
