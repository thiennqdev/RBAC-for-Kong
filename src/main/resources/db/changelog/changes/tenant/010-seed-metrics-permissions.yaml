databaseChangeLog:
  - changeSet:
      id: tenant-010-seed-metrics-permissions
      author: system
      comment: Seed permissions for prometheus metrics
      preConditions:
        - onFail: MARK_RAN
        - sqlCheck:
            expectedResult: 0
            sql: SELECT COUNT(*) FROM permissions WHERE permission_name = 'METRICS_READ'
      changes:
        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: METRICS_READ }
              - column: { name: description, value: "View real-time prometheus metrics" }
              - column: { name: api_path, value: "/projects/*/metrics/**" }
              - column: { name: http_method, value: "GET" }
              - column: { name: created_by, value: system }
              - column: { name: updated_by, value: system }

        # PROJECT_ADMIN -> METRICS_READ
        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.role_name = 'PROJECT_ADMIN' AND p.permission_name = 'METRICS_READ'
              AND NOT EXISTS (SELECT 1 FROM role_permissions rp WHERE rp.role_id = r.id AND rp.permission_id = p.id);
