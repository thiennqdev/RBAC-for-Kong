databaseChangeLog:
  - changeSet:
      id: 012-add-project-permissions
      author: system
      comment: >
        Add PROJECT management permissions (READ, CREATE, WRITE, DELETE, REACTIVATE)
        and assign them to SYSTEM_ADMIN role. The REACTIVATE action covers
        PATCH /projects/{code}/reactivate which was missing and caused 403.
      changes:
        # Insert PROJECT permissions
        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: PROJECT_READ }
              - column: { name: api_path,        value: "/projects/**" }
              - column: { name: http_method,     value: "GET" }
              - column: { name: description,     value: "View projects and project details" }
              - column: { name: created_by,      value: system }
              - column: { name: updated_by,      value: system }

        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: PROJECT_CREATE }
              - column: { name: api_path,        value: "/projects" }
              - column: { name: http_method,     value: "POST" }
              - column: { name: description,     value: "Create new projects with schema isolation" }
              - column: { name: created_by,      value: system }
              - column: { name: updated_by,      value: system }

        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: PROJECT_WRITE }
              - column: { name: api_path,        value: "/projects/**" }
              - column: { name: http_method,     value: "PUT" }
              - column: { name: description,     value: "Edit project name and settings" }
              - column: { name: created_by,      value: system }
              - column: { name: updated_by,      value: system }

        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: PROJECT_DELETE }
              - column: { name: api_path,        value: "/projects/**" }
              - column: { name: http_method,     value: "DELETE" }
              - column: { name: description,     value: "Soft-delete or hard-delete projects" }
              - column: { name: created_by,      value: system }
              - column: { name: updated_by,      value: system }

        - insert:
            tableName: permissions
            columns:
              - column: { name: permission_name, value: PROJECT_REACTIVATE }
              - column: { name: api_path,        value: "/projects/*/reactivate" }
              - column: { name: http_method,     value: "PATCH" }
              - column: { name: description,     value: "Reactivate an INACTIVE project back to ACTIVE status" }
              - column: { name: created_by,      value: system }
              - column: { name: updated_by,      value: system }

        # Grant all PROJECT_* permissions to SYSTEM_ADMIN
        - sql:
            sql: >
              INSERT INTO role_permissions (role_id, permission_id)
              SELECT r.id, p.id FROM roles r, permissions p
              WHERE r.role_name = 'SYSTEM_ADMIN'
                AND p.permission_name LIKE 'PROJECT_%'
                AND NOT EXISTS (
                  SELECT 1 FROM role_permissions rp
                  WHERE rp.role_id = r.id AND rp.permission_id = p.id
                )

      rollback:
        - sql:
            sql: >
              DELETE FROM role_permissions
              WHERE permission_id IN (
                SELECT id FROM permissions WHERE permission_name LIKE 'PROJECT_%'
              )
        - delete:
            tableName: permissions
            where: permission_name LIKE 'PROJECT_%'
