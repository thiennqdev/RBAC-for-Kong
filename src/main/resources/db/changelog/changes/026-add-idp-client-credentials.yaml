databaseChangeLog:
  - changeSet:
      id: 026-add-idp-client-credentials
      author: rbac-service
      comment: "Add Identity Provider (IdP) client credentials to projects table"
      changes:
        - addColumn:
            schemaName: public
            tableName: projects
            columns:
              - column:
                  name: idp_client_id
                  type: VARCHAR(200)
                  constraints:
                    nullable: true
                  remarks: "OIDC Client ID for Kong authentication"
              - column:
                  name: idp_client_secret
                  type: VARCHAR(500)
                  constraints:
                    nullable: true
                  remarks: "OIDC Client Secret for Kong authentication"
